<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d6a50" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Portail SRE de Haute Matsiatra : consultation des données enregistrées et suivi des déclarations transmises au serveur." />
    <title>SRE · Portail Haute Matsiatra</title>
    <script>
      try {
        var t = localStorage.getItem("sre-theme");
        if (t !== "clair" && t !== "sombre")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "sombre" : "clair";
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.toggle("dark", t === "sombre");
        document.documentElement.style.colorScheme = t === "sombre" ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
