# Configuration Netlify (utilisée si FRONTEND_HOST = netlify).
# Le déploiement depuis GitHub Actions passe par `netlify deploy --dir=dist`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage : toutes les routes inconnues renvoient index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Les fichiers de /assets sont hachés par Vite : cache long et immuable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
